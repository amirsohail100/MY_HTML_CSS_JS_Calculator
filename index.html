<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web Calculator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- Ambient Background Lighting -->
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <!-- Dynamic Floating Mathematical Symbols Background -->
    <div class="math-bg-container" aria-hidden="true">
        <span style="--i:1; --x:5%;">+</span>
        <span style="--i:2; --x:15%;">−</span>
        <span style="--i:3; --x:25%;">×</span>
        <span style="--i:4; --x:35%;">÷</span>
        <span style="--i:5; --x:45%;">%</span>
        <span style="--i:6; --x:55%;">=</span>
        <span style="--i:7; --x:65%;">√</span>
        <span style="--i:8; --x:75%;">π</span>
        <span style="--i:9; --x:85%;">(</span>
        <span style="--i:10; --x:92%;">)</span>
        <span style="--i:11; --x:10%;">÷</span>
        <span style="--i:12; --x:30%;">+</span>
        <span style="--i:13; --x:50%;">×</span>
        <span style="--i:14; --x:70%;">−</span>
        <span style="--i:15; --x:88%;">%</span>
    </div>

    <!-- Theme Toggle Control -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" aria-label="Toggle Dark/Light Mode">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <h1>Calculator App</h1>

    <div id="main">
        <div id="Calculator-bady">
            <div class="output-box">0</div>
            <div class="but-part">
                <div class="but-line">
                    <button class="but-sin">%</button>
                    <button class="but-s">CE</button>
                    <button class="but-sin">/</button>
                    <button class="but-s delBut">DEL</button>
                </div>
                <div class="but-line">
                    <button class="but">7</button>
                    <button class="but">8</button>
                    <button class="but">9</button>
                    <button class="but-sin">x</button>
                </div>
                <div class="but-line">
                    <button class="but">4</button>
                    <button class="but">5</button>
                    <button class="but">6</button>
                    <button class="but-sin">-</button>
                </div>
                <div class="but-line">
                    <button class="but">1</button>
                    <button class="but">2</button>
                    <button class="but">3</button>
                    <button class="but-sin">+</button>
                </div>
                <div class="but-line">
                    <button class="but-sin">+/-</button>
                    <button class="but">0</button>
                    <button class="but">.</button>
                    <button class="but-s">=</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Theme Switcher Script -->
    <script>
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = themeBtn.querySelector('i');

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
